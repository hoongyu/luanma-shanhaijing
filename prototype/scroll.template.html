<meta charset="utf-8">
<title>session · 手卷</title>
<script id="data" type="application/json">__DATA__</script>
<style>
  :root{
    --paper:#EFE9DC;
    --paper-deep:#E4DCCB;
    --ink:#14110D;
    --ink-6:rgba(20,17,13,.06);
    --ink-12:rgba(20,17,13,.12);
    --ink-30:rgba(20,17,13,.30);
    --ink-55:rgba(20,17,13,.55);
    --cinnabar:#A8352A;
    --serif:"Songti SC","SimSun","Source Han Serif SC","Noto Serif SC",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    overflow:hidden;
    /* paper grain */
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,.020) 0 1px, transparent 1px),
      radial-gradient(circle at 70% 65%, rgba(0,0,0,.016) 0 1px, transparent 1px);
    background-size:7px 7px, 11px 11px;
  }

  /* ── 引首 : the vertical title panel a handscroll opens with ─────── */
  .yinshou{
    position:fixed; left:0; top:0; bottom:0; width:112px; z-index:20;
    background:linear-gradient(90deg,var(--paper-deep) 0%, var(--paper) 82%, transparent 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    border-right:1px solid var(--ink-6);
  }
  .yinshou h1{
    writing-mode:vertical-rl; font-size:27px; font-weight:400;
    letter-spacing:.42em; line-height:1;
  }
  .yinshou .sub{
    writing-mode:vertical-rl; font-size:11px; letter-spacing:.3em;
    color:var(--ink-55);
  }
  .seal{
    width:34px;height:34px;border:1.5px solid var(--cinnabar);color:var(--cinnabar);
    display:grid;place-items:center;font-size:11px;letter-spacing:.1em;
    writing-mode:vertical-rl; opacity:.88; border-radius:2px;
  }

  /* ── the scroll itself ───────────────────────────────────────────── */
  #scroll{
    position:absolute; inset:0 0 0 112px;
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:thin; scrollbar-color:var(--ink-12) transparent;
  }
  #stage{position:relative; height:100%;}
  /* 地平线 */
  #stage::after{
    content:""; position:absolute; left:0; right:0; bottom:132px; height:1px;
    background:linear-gradient(90deg,transparent,var(--ink-12) 6%,var(--ink-12) 94%,transparent);
  }

  .ridge{
    position:absolute; bottom:132px; transform-origin:50% 100%;
    cursor:pointer;
    transition:transform .62s cubic-bezier(.22,.9,.24,1), opacity .5s ease, filter .5s ease;
  }
  .ridge svg{display:block; overflow:visible}
  .ridge .label{
    position:absolute; left:0; top:100%; padding-top:11px;
    font-size:10px; letter-spacing:.16em; color:var(--ink-30);
    white-space:nowrap; transition:color .4s ease;
  }
  .ridge:hover{transform:translateY(-7px)}
  .ridge:hover .label{color:var(--ink-55)}
  body.zoomed .ridge{opacity:.13; filter:blur(1.4px)}
  body.zoomed .ridge.active{opacity:1; filter:none}

  /* click feedback: ink drops into the paper */
  .ripple{
    position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(168,53,42,.30) 0%, rgba(168,53,42,0) 68%);
    animation:bleed .72s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes bleed{
    from{width:6px;height:6px;opacity:.95;transform:translate(-50%,-50%)}
    to{width:190px;height:190px;opacity:0;transform:translate(-50%,-50%)}
  }

  /* ── 题跋 : the colophon at the end of a scroll ──────────────────── */
  .bawen{
    position:absolute; bottom:132px; width:310px;
    border-left:1px solid var(--ink-12); padding:6px 0 6px 26px;
  }
  .bawen h2{font-size:13px;font-weight:400;letter-spacing:.3em;margin-bottom:20px}
  .bawen dl{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:12px}
  .bawen dt{color:var(--ink-30);letter-spacing:.12em}
  .bawen dd{text-align:right;font-variant-numeric:tabular-nums}
  .bawen .hero{margin-top:24px;padding-top:20px;border-top:1px solid var(--ink-12)}
  .bawen .hero b{display:block;font-size:31px;font-weight:400;color:var(--cinnabar);
    font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .bawen .hero span{display:block;font-size:11px;color:var(--ink-55);margin-top:7px;line-height:1.8}

  /* ── hover readout ──────────────────────────────────────────────── */
  #tip{
    position:fixed; z-index:40; pointer-events:none; opacity:0;
    transform:translate(-50%,-118%); transition:opacity .2s ease;
    background:rgba(239,233,220,.96); border:1px solid var(--ink-12);
    padding:11px 15px; font-size:11.5px; line-height:1.85; min-width:158px;
    box-shadow:0 10px 30px rgba(20,17,13,.10);
  }
  #tip.on{opacity:1}
  #tip .k{color:var(--ink-30); letter-spacing:.1em}
  #tip .v{float:right; margin-left:22px; font-variant-numeric:tabular-nums}
  #tip .hd{letter-spacing:.2em;margin-bottom:7px;padding-bottom:6px;
    border-bottom:1px solid var(--ink-12)}

  #hint{
    position:fixed; right:26px; bottom:22px; z-index:30;
    font-size:10.5px; letter-spacing:.22em; color:var(--ink-30);
    transition:opacity .5s ease;
  }
  body.zoomed #hint{opacity:0}
  #back{
    position:fixed; right:26px; bottom:22px; z-index:31;
    font-size:10.5px; letter-spacing:.22em; color:var(--cinnabar);
    cursor:pointer; opacity:0; pointer-events:none; transition:opacity .5s ease;
  }
  body.zoomed #back{opacity:1; pointer-events:auto}
</style>

<div class="yinshou">
  <h1>此卷</h1>
  <div class="sub" id="span"></div>
  <div class="seal">墨迹</div>
</div>

<div id="scroll"><div id="stage"></div></div>
<div id="tip"></div>
<div id="hint">横向卷动 · 点击山脊展开 · 留白为静默，对数压缩</div>
<div id="back">← 收卷</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const stage = document.getElementById('stage');
const tip = document.getElementById('tip');
const NS = 'http://www.w3.org/2000/svg';

const MAX_H = 300;          // tallest ridge
const fmt = n => n.toLocaleString('en-US');

document.getElementById('span').textContent =
  `${D.meta.span_days} 日 · ${D.meta.bursts} 段`;

const maxTok = Math.max(...D.bursts.map(b => b.out_tokens));
const TOTAL_S = D.meta.span_days * 86400;

/* 散点透视 : a handscroll never uses linear time. Each scene takes the width
   it needs; the emptiness between scenes carries the sense of elapsed time.
   Silence is log-compressed -- a ten-day gap must read as "long" without
   eating the whole scroll. Stated in the UI so the axis isn't a lie. */
const ridgeW = b => Math.max(58, Math.min(300, 40 + b.nodes * 0.52));

let cursor = 60;
const layout = D.bursts.map((b, i) => {
  if (i > 0) {
    const silence = Math.max(0, (b.start_offset - D.bursts[i-1].end_offset) * TOTAL_S);
    const hours = silence / 3600;
    cursor += Math.max(46, Math.min(430, 46 + Math.log10(1 + hours) * 165));
  }
  const x = cursor;
  cursor += ridgeW(b);
  return { x, w: ridgeW(b) };
});
const SCROLL_END = cursor;

/* A ridge profile built from the burst's own beats. The silhouette IS the
   token curve -- the mountain is not decoration, it is the data. */
function ridgePath(beats, w, h){
  if (!beats.length) return `M0 0 L${w} 0 Z`;
  const span = Math.max(1, beats[beats.length-1].t);
  const peak = Math.max(1, ...beats.map(b => b.w));
  const pts = beats.map(b => [ (b.t/span)*w, -(b.w/peak)*h ]);
  pts.unshift([0,0]); pts.push([w,0]);

  // Catmull-Rom -> cubic bezier, for a brushed rather than jagged edge
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d + ' Z';
}

stage.style.width = SCROLL_END + 520 + 'px';

D.bursts.forEach((b, i) => {
  const { x, w } = layout[i];
  const h = Math.max(34, (b.out_tokens / maxTok) * MAX_H);

  const el = document.createElement('div');
  el.className = 'ridge';
  el.style.left = x + 'px';
  el.style.width = w + 'px';

  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('width', w); svg.setAttribute('height', h + 4);
  svg.setAttribute('viewBox', `0 ${-h} ${w} ${h+4}`);

  const gid = `g${i}`, fid = `f${i}`;
  svg.innerHTML = `
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#14110D" stop-opacity=".82"/>
        <stop offset="55%"  stop-color="#14110D" stop-opacity=".46"/>
        <stop offset="100%" stop-color="#14110D" stop-opacity=".13"/>
      </linearGradient>
      <filter id="${fid}" x="-14%" y="-14%" width="128%" height="128%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="${i*7+3}" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>`;

  const p = document.createElementNS(NS,'path');
  p.setAttribute('d', ridgePath(b.beats, w, h));
  p.setAttribute('fill', `url(#${gid})`);
  p.setAttribute('filter', `url(#${fid})`);
  svg.appendChild(p);

  // 支脉 : forks branch off the ridge line
  const forkBeats = b.beats.filter(x => x.fork);
  const span = Math.max(1, b.beats.length ? b.beats[b.beats.length-1].t : 1);
  const peak = Math.max(1, ...b.beats.map(x => x.w), 1);
  forkBeats.slice(0, 24).forEach(fb => {
    const fx = (fb.t/span)*w, fy = -(fb.w/peak)*h;
    const s = document.createElementNS(NS,'path');
    const dir = (fb.t % 2 === 0) ? 1 : -1;
    s.setAttribute('d', `M${fx.toFixed(1)} ${fy.toFixed(1)} q${(7*dir).toFixed(1)} ${(-h*0.13).toFixed(1)} ${(13*dir).toFixed(1)} ${(-h*0.21).toFixed(1)}`);
    s.setAttribute('stroke', 'rgba(20,17,13,.34)');
    s.setAttribute('stroke-width','1'); s.setAttribute('fill','none');
    s.setAttribute('stroke-linecap','round');
    svg.appendChild(s);
  });

  el.appendChild(svg);

  // 朱砂印 : one seal per model this burst ran under
  b.models.filter(m => m && m !== '<synthetic>').slice(0,2).forEach((m, k) => {
    const sq = document.createElementNS(NS,'rect');
    sq.setAttribute('x', w - 13 - k*10); sq.setAttribute('y', -h - 15);
    sq.setAttribute('width', 7); sq.setAttribute('height', 7);
    sq.setAttribute('fill', '#A8352A'); sq.setAttribute('opacity', .82 - k*.28);
    sq.setAttribute('rx', 1);
    svg.appendChild(sq);
  });

  const lab = document.createElement('div');
  lab.className = 'label';
  lab.textContent = new Date(b.start).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
  el.appendChild(lab);

  el.addEventListener('mousemove', e => {
    tip.classList.add('on');
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
    tip.innerHTML =
      `<div class="hd">第 ${i+1} 段</div>` +
      `<div><span class="k">时长</span><span class="v">${b.dur_min} 分</span></div>` +
      `<div><span class="k">往复</span><span class="v">${fmt(b.nodes)}</span></div>` +
      `<div><span class="k">分叉</span><span class="v">${b.forks}</span></div>` +
      `<div><span class="k">落墨</span><span class="v">${fmt(b.out_tokens)}</span></div>` +
      (b.top_tools.length ? `<div><span class="k">主用</span><span class="v">${b.top_tools[0][0]}</span></div>` : '');
  });
  el.addEventListener('mouseleave', () => tip.classList.remove('on'));

  el.addEventListener('click', e => {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = (e.clientX - el.getBoundingClientRect().left) + 'px';
    r.style.top  = (e.clientY - el.getBoundingClientRect().top)  + 'px';
    el.appendChild(r); setTimeout(() => r.remove(), 760);

    const already = el.classList.contains('active');
    document.querySelectorAll('.ridge').forEach(n => {
      n.classList.remove('active'); n.style.transform = '';
    });
    if (already){ document.body.classList.remove('zoomed'); return; }
    document.body.classList.add('zoomed');
    el.classList.add('active');
    el.style.transform = 'translateY(-16px) scale(1.9)';
    el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  });

  stage.appendChild(el);
});

/* 题跋 */
const colophon = document.createElement('div');
colophon.className = 'bawen';
colophon.style.left = (SCROLL_END + 130) + 'px';
const ratio = Math.round(D.meta.cache_read / D.meta.in_tokens);
colophon.innerHTML = `
  <h2>题 跋</h2>
  <dl>
    <dt>历时</dt><dd>${D.meta.span_days} 日</dd>
    <dt>往复</dt><dd>${fmt(D.meta.nodes)}</dd>
    <dt>分叉</dt><dd>${fmt(D.meta.forks)}</dd>
    <dt>落墨</dt><dd>${fmt(D.meta.out_tokens)}</dd>
    <dt>新读</dt><dd>${fmt(D.meta.in_tokens)}</dd>
    <dt>重读</dt><dd>${fmt(D.meta.cache_read)}</dd>
  </dl>
  <div class="hero">
    <b>${ratio}×</b>
    <span>缓存重读是新增输入的 ${ratio} 倍。<br>你以为在写，其实一直在读。</span>
  </div>`;
stage.appendChild(colophon);

document.getElementById('back').addEventListener('click', () => {
  document.body.classList.remove('zoomed');
  document.querySelectorAll('.ridge').forEach(n => {
    n.classList.remove('active'); n.style.transform = '';
  });
});
addEventListener('keydown', e => { if (e.key === 'Escape')
  document.getElementById('back').click(); });

// wheel scrolls the scroll sideways, as a handscroll should
document.getElementById('scroll').addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){
    e.preventDefault(); e.currentTarget.scrollLeft += e.deltaY;
  }
}, {passive:false});
</script>
