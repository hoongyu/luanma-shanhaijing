id: nfd_lv
name: 分解的拼音
tag: 规范化
glyphs: [l, u, "?", "?"]
out: "l u ? ?"
why: >-
  拼音 lǘ 的预组合形式（l + U+01DC）GBK 编得出来，分解形式的两枚
  组合符号 GBK 根本没有。同一个词，一个存得进老库，一个存不进。
notes:
  - [現, 跨系统搬运带声调的拼音：macOS 剪贴板与文件名、某些输入法、某些 PDF 抽取器]
  - [異, NFD 对汉字是恒等变换（汉字没有规范分解）。「macOS 的 NFD 会拆坏中文」是谣传——它拆的是韩文谚文]
  - [驅, 入库前统一 NFC；比较字符串前也要先规范化]
repro: nfd_lv
expect: "lu??"
