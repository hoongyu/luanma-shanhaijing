id: xingnaoxing
name: 形闹形
tag: 编码误读
glyphs: [形, 闹, 形]
codec: gbk
hex_texture: D0 CE C4 D6 D0 CE
bytes: [D0 CE, C4 D6, D0 CE]
out: 形 闹 形
why: >-
  GBK 不自同步。丢掉首尾各一字节后所有配对整体错开一位：D0CE=形、
  C4D6=闹、D0CE=形。要害在于 UTF-8 的续字节高位固定是 10，丢字节后
  能在 3 字节内重新对齐；GBK 低字节可取 0x40–0xFE 与高字节区间重叠，
  没有任何标志能指出「我是第二字节」。一个字节的丢失把其后整篇文档
  静默改写成另一段合法中文：不抛异常、不出替换字符、不掉长度。
notes:
  - [現, 二进制流丢字节、错误跳过一字节头或 BOM、按字节 seek、定长记录解析错位]
  - [異, 同一刀砍在 UTF-8 上只伤一个字就恢复对齐，见 banzi（待收录）]
  - [驅, 换 UTF-8（3 字节内自动重同步）；GBK 流必须校验长度奇偶并带同步点]
repro: xingnaoxing
expect: 形闹形
