id: zhushi
name: 一变四
tag: 规范化
glyphs: [株, 式, 会, 社]
out: 株 式 会 社
why: >-
  NFKC 不只把串变短，也把串变长。单个码位 U+337F ㍿ 炸成四个汉字。
  凡是先按原串长度分配缓冲区、或先过了长度校验再规范化的代码，这里
  就穿帮：一个字符的输入撑爆四个字符的限额。
notes:
  - [現, 任何「先校验长度、后规范化」或「按输入长度预分配」的路径]
  - [異, 同族更狠的：U+3316 一个码位炸成六个片假名。反向的 U+2160 折成 I、U+2460 折成 1，长度不变但语义全丢]
  - [驅, 先规范化再校验长度，顺序不能反。存储层别用 NFKC——它有损，株式会社变不回㍿]
repro: zhushi
expect: 株式会社
