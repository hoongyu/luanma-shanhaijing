id: shen
name: 换脸
tag: 规范化
glyphs: [神]
out: 神
why: >-
  全谱最阴的一只——输入输出肉眼完全一样，码位却被换掉了。CJK 兼容汉字
  U+FA19 带「单例规范分解」，单例分解永不重组，所以连 NFC 都会把它换成
  U+795E。这些字当初编进来只为了和日韩旧字符集往返，字形常有细微差别
  （人名里的「神」「﨑」「塚」靠这个区分），一次静默规范化就把姓氏改了。
notes:
  - [現, 任何做了 NFC/NFKC 的环节：数据库 collation、搜索索引、文件系统、表单校验、URL 规范化]
  - [異, 兼容区 472 个字里 460 个带分解、12 个免疫。U+FA11「﨑」过 NFC 纹丝不动]
  - [驅, 人名字段不要规范化，或规范化前后都存一份。已换脸不可逆]
repro: shen
expect: 神
