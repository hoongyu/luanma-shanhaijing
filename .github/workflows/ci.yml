name: 妖谱一致性

on:
  push:
  pull_request:
  schedule:
    # 每天 UTC 22:17 —— 避开整点，GitHub Actions 在 xx:00 会 drop scheduled event
    - cron: "17 22 * * *"

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    # windows-latest 的默认控制台编码是 cp1252，而本项目的断言信息是中文。
    # 不设这个，测试变红时你读到的会是乱码 —— 一个专治乱码的项目栽在这上面
    # 未免太蠢。
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.14 是本项目日常开发所用的解释器版本，必须在矩阵里 ——
        # 全部结论都建立在编解码器行为上，不能让开发机成为唯一未被验证的环境。
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装
        run: python -m pip install -e ".[dev]"
      - name: 跑全谱一致性
        run: python -m pytest tests/ -v
